<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2 — interactive heart hero (preview)</title>
<style>
  html, body { margin: 0; background: #F0EEDF; font-family: "Helvetica Neue", Arial, sans-serif; }
  .hero { position: relative; height: 100vh; overflow: hidden; }
  .hero .copy { position: absolute; left: 6vw; top: 14vh; color: #3154E8; pointer-events: none; z-index: 2; }
  .hero h1 { margin: 0; font-weight: 400; font-size: clamp(32px, 5vw, 76px); line-height: 1.05; letter-spacing: -0.01em; }
  .hero p { margin: 18px 0 0; font-size: 14px; letter-spacing: .2em; color: #ED662E; }
</style>
</head>
<body>
  <section class="hero" data-b2-heart>
    <div class="copy">
      <h1>A LITTLE STRANGE.<br>A LOT OF IMAGINATION.</h1>
      <p>MOVE · CLICK THE HEART</p>
    </div>
  </section>
  <script type="module" src="b2-heart.js"></script>
</body>
</html>
