<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LOOVA launch film — editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0d0f12; --panel:#15181d; --line:#262b33; --ink:#e8ecf1; --dim:#8b95a3; --mint:#00F5A0; --cyan:#00D9F5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 420px; height: 100vh; }
  #stage { display: flex; flex-direction: column; min-width: 0; padding: 14px; gap: 10px; }
  #view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 8px; overflow: hidden; }
  #view canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16/9; }
  #transport { display: flex; gap: 10px; align-items: center; }
  #transport button { background: linear-gradient(90deg, var(--mint), var(--cyan)); color: #05070A; border: 0; border-radius: 6px; padding: 7px 14px; font-weight: 700; cursor: pointer; }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 120px; }
  #scrub { flex: 1; }
  #strip { position: relative; height: 34px; background: var(--panel); border-radius: 6px; overflow: hidden; cursor: pointer; }
  #strip .sc { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--bg); padding: 4px 6px; font-size: 11px; color: #cfd6df; overflow: hidden; white-space: nowrap; }
  #strip .cue { position: absolute; bottom: 0; width: 1px; height: 9px; background: #ffd34d; opacity: .7; }
  #strip .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
  #status { font-size: 12px; color: var(--dim); min-height: 18px; }
  #status .warn { color: #ffb84d; }
  #panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 10px 12px 60px; }
  #panel h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--mint); margin: 18px 0 6px; }
  details { border: 1px solid var(--line); border-radius: 6px; margin: 6px 0; }
  summary { padding: 7px 9px; cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  summary .meta { margin-left: auto; color: var(--dim); font-weight: 400; }
  .body { padding: 4px 10px 10px; }
  .row { display: grid; grid-template-columns: 112px 1fr; gap: 8px; align-items: center; margin: 4px 0; }
  .row label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type=text], input[type=number], textarea, select { width: 100%; background: #0d0f12; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
  textarea { resize: vertical; min-height: 34px; }
  input[type=range] { width: 100%; }
  .pair { display: grid; grid-template-columns: 1fr 64px; gap: 6px; }
  .sub { border-left: 2px solid var(--line); padding-left: 8px; margin: 8px 0; }
  .sub b { color: #cfd6df; font-weight: 600; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .btns button, .mini { background: #222831; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; cursor: pointer; }
  .mini { padding: 1px 6px; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="view"><canvas id="c" width="1920" height="1080"></canvas></div>
    <div id="transport">
      <button id="play">Play</button>
      <label><input type="checkbox" id="sound" checked> sound</label>
      <span id="time">0.00 / 0.00</span>
      <input type="range" id="scrub" min="0" max="1000" value="0">
    </div>
    <div id="strip"></div>
    <div id="status">Loading assets…</div>
  </div>
  <div id="panel"></div>
</div>
<script type="module" src="src/ui.js"></script>
</body>
</html>
